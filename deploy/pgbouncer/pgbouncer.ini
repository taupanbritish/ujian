; PgBouncer untuk ShanaTech CBT
; Salin ke /etc/pgbouncer/pgbouncer.ini lalu sesuaikan nama database & angka pool.
; Panduan lengkap: deploy/pgbouncer/README.md

[databases]
; Nama di kiri dipakai pada DATABASE_URL, contoh:
; postgresql://cendekia:SANDI@127.0.0.1:6432/cendekia
cendekia = host=127.0.0.1 port=5432 dbname=cendekia

[pgbouncer]
; Samakan host dengan lokasi aplikasi. Bila aplikasi di server lain, ganti ke
; alamat privat server ini dan batasi lewat firewall.
listen_addr = 127.0.0.1
listen_port = 6432

; Gunakan auth_type sesuai metode sandi di PostgreSQL:
;   scram-sha-256 (PostgreSQL 14+ bawaan) atau md5 (instalasi lama).
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Mode transaction: koneksi server hanya dipinjam selama satu transaksi.
; Aplikasi ini tidak memakai fitur sesi (LISTEN, advisory lock, temp table),
; jadi aman dan paling efisien untuk HTTP/Express.
pool_mode = transaction

; ── Ukuran pool ─────────────────────────────────────────────────────────────
; Klien = koneksi dari aplikasi ke PgBouncer.
; Total klien ≈ DATABASE_POOL_MAX × jumlah proses API + margin.
max_client_conn = 600

; Server = koneksi nyata ke PostgreSQL. Patokan: 2–4 × vCPU server database,
; jangan melebihi max_connections PostgreSQL dikurangi koneksi admin/cadangan.
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 40

server_idle_timeout = 60
server_lifetime = 3600
query_wait_timeout = 30

; node-postgres mengirim prepared statement tanpa nama (unnamed), sehingga tidak
; butuh fitur prepared statement bernama PgBouncer. Biarkan 0.
max_prepared_statements = 0

; Parameter startup yang aman diabaikan (dikirim sebagian driver).
ignore_startup_parameters = extra_float_digits

; Konsol admin: psql -h 127.0.0.1 -p 6432 -U pgbouncer pgbouncer
admin_users = pgbouncer
stats_users = pgbouncer

log_connections = 1
log_disconnections = 0
stats_period = 60
